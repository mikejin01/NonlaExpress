<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- the page ground, so browser chrome matches the site: cream since the
		     2026-08-07 colour swap (plan §1.2d). Keep this in step with
		     app.css --surface; it is the tag the client notices first. -->
		<meta name="theme-color" content="#F0EAD6" />

		<!-- Type system (docs/redesign-plan.md §1.1). Playfair Display 900 stands in
		     for the original's TT Nooks Bold behind --display (§5 Q2); Maname is the
		     original's workhorse serif; Overpass is a near-cousin of the original's
		     Expressway Bold button face. All three carry a vietnamese subset. -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Maname&family=Playfair+Display:ital,wght@0,900;1,900&family=Overpass:wght@600;700&family=Noto+Serif+SC:wght@600;700;900&display=swap"
			rel="stylesheet"
		/>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
